name: Runs the tests

on:
  - push
  - pull_request

jobs:
  build-polypheny:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          repository: polypheny/Polypheny-DB
          ref: master

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build executable server and plugins
        run: ./gradlew :dbms:shadowJar assemblePlugins -PwithoutpullingUi=true --console=plain

      - name: Select executable server JAR
        run: |
          python - <<'PY'
          from pathlib import Path
          import shutil
          import zipfile
          candidates = [path for path in Path('dbms/build/libs').glob('dbms-*.jar')
                        if not path.stem.endswith(('-tests', '-sources', '-javadoc'))]
          assert len(candidates) == 1, f'Expected one executable JAR, found {candidates}'
          with zipfile.ZipFile(candidates[0]) as archive:
              assert 'org/slf4j/Logger.class' in archive.namelist(), 'Server JAR lacks runtime dependencies'
          shutil.copyfile(candidates[0], 'polypheny.jar')
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: polypheny-jar
          path: polypheny.jar

  test-system-python:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        version: ['3.9', '3.10', '3.11', '3.12', '3.13']
        os: [ubuntu-24.04, macos-latest, windows-latest]
        # Python 3.9 has no Ubuntu 26.04 build. Python 3.9/3.10 on
        # macOS require the Intel distribution; retain all 15 combinations.
        exclude:
          - {version: '3.9', os: macos-latest}
          - {version: '3.10', os: macos-latest}
        include:
          - {version: '3.9', os: macos-15-intel}
          - {version: '3.10', os: macos-15-intel}
    runs-on: ${{ matrix.os }}
    needs: build-polypheny
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Set Version
        id: version
        run: echo "v0.0.0" > polypheny-connector-version.txt

      - name: Create MANIFEST.in
        run: echo "include polypheny-connector-version.txt" > MANIFEST.in

      - name: Install driver dependencies
        run: pip install -r requirements.txt

      - name: Load Polypheny JAR
        uses: actions/download-artifact@v4
        with:
          name: polypheny-jar

      - name: Run tests
        uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
        with:
          cmd: pytest --doctest-modules -v
          jar: polypheny.jar
          autodocker: ${{ matrix.os != 'windows' }}
        timeout-minutes: 10

      - name: Install locally
        run: pip install .

      - name: Run tests in docs
        uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
        with:
          cmd: make doctest
          jar: ../polypheny.jar
          autodocker: ${{ matrix.os != 'windows' }}
          working-directory: docs

  test-stores:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        adapter: [ mongodb, hsqldb, monetdb, postgresql, file, neo4j ]
    runs-on: ubuntu-24.04
    needs: build-polypheny
    steps:
      - name: Set store env variable
        run: |
            echo "DEFAULT_STORE=${{ matrix.adapter }}" >> $GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Set Version
        id: version
        run: echo "v0.0.0" > polypheny-connector-version.txt

      - name: Create MANIFEST.in
        run: echo "include polypheny-connector-version.txt" > MANIFEST.in

      - name: Install driver dependencies
        run: pip install -r requirements.txt

      - name: Load Polypheny JAR
        uses: actions/download-artifact@v4
        with:
          name: polypheny-jar

      - name: Run tests
        uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
        with:
          cmd: pytest --doctest-modules -v
          jar: polypheny.jar
          default-store: ${{ matrix.adapter }}
        timeout-minutes: 10

      - name: Install locally
        run: pip install .

      - name: Run tests in docs
        uses: polypheny/GitHub-Action-Run-Polypheny@v0.2.0
        with:
          cmd: make doctest
          jar: ../polypheny.jar
          working-directory: docs
          default-store: ${{ matrix.adapter }}

  build-docs:
    timeout-minutes: 2
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout driver
        uses: actions/checkout@v4

      - name: Set Version
        id: version
        run: echo "v0.0.0" > polypheny-connector-version.txt

      - name: Create MANIFEST.in
        run: echo "include polypheny-connector-version.txt" > MANIFEST.in
        
      - name: Install driver dependencies
        run: pip install -r requirements.txt

      - name: Install markdown generator
        run: pip install sphinx-markdown-builder

      - name: Install locally
        run: pip install .

      - name: Generate documentation (markdown)
        run: make markdown
        working-directory: docs

      - name: Generate documentation (HTML)
        run: make html
        working-directory: docs

      - name: Store docs
        uses: actions/upload-artifact@v4
        with:
          name: docs
          path: docs/_build

